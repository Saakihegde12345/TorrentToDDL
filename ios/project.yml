name: TorrentToDDL
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TorrentToDDL:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.torrenttoddl.ios
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TorrentToDDL-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../native/include"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-lz"]
    dependencies:
      - framework: Generated/TorrentNative.xcframework
        embed: false
      - sdk: Network.framework
      - sdk: CoreFoundation.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
  TorrentToDDLTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.torrenttoddl.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TorrentToDDL
  TorrentToDDLUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.torrenttoddl.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TorrentToDDL
schemes:
  TorrentToDDL:
    build:
      targets:
        TorrentToDDL: all
        TorrentToDDLTests: [test]
        TorrentToDDLUITests: [test]
    test:
      targets: [TorrentToDDLTests, TorrentToDDLUITests]
      gatherCoverageData: true
