name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # Never expose the persistent signing key to pull-request code.
      - name: Restore stable debug signing key
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/restore-debug-keystore.sh

      - name: Mark pull-request APK as a preview
        if: github.event_name == 'pull_request'
        run: echo "::warning::Pull-request APKs use a temporary debug key and may not update an installed app."

      - name: Run Android lint and checks
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            echo "Using the committed Gradle wrapper."
            bash ./gradlew lintDebug check --no-daemon --stacktrace
          else
            echo "::warning::No Gradle wrapper found; using Gradle 8.5 provisioned by gradle/actions/setup-gradle."
            gradle lintDebug check --no-daemon --stacktrace
          fi

      - name: Build debug APK
        id: apk
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            bash ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Record APK signing certificate
        if: ${{ success() && steps.apk.outcome == 'success' }}
        run: |
          set -euo pipefail
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-signing-certificate.txt

      - name: Name APK
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk TorrentToDDL.apk

      # Internal transfer to the publish job; users download the release asset.
      - name: Store APK for publishing
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: TorrentToDDL-debug-apk
          path: TorrentToDDL.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TorrentToDDL-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/logs/**
            build/reports/**
            build/test-results/**
            apk-signing-certificate.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish direct APK download
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve APK
        uses: actions/download-artifact@v4
        with:
          name: TorrentToDDL-debug-apk
          path: apk

      - name: Publish APK release and download link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          RELEASE_TAG: debug-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" apk/TorrentToDDL.apk \
            --target "$BUILD_SHA" \
            --title "TorrentToDDL debug build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK from commit ${BUILD_SHA}. Download TorrentToDDL.apk under Assets." \
            --prerelease
          download_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/TorrentToDDL.apk"
          printf '### APK ready\n\n[Download TorrentToDDL.apk](%s)\n' "$download_url" >> "$GITHUB_STEP_SUMMARY"
