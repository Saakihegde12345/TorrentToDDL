name: Public Android Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'CHECK'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName\s*=\s*"([^"]+)"', Path("app/build.gradle.kts").read_text()).group(1)
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Stable version required"
          assert os.environ["RELEASE_TAG"] == "v" + version, "Tag/version mismatch"
          assert Path("release-notes/" + os.environ["RELEASE_TAG"] + ".md").is_file(), "Missing notes"
          CHECK

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Restore required signing identity
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "::error::Missing persistent signing key"; exit 1; }
          bash scripts/restore-debug-keystore.sh

      - name: Test and build release
        run: |
          set -euo pipefail
          test -s "$TORRENTTODDL_DEBUG_KEYSTORE"
          gradle :app:lintRelease :app:testReleaseUnitTest :core:test :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk TorrentToDDL.apk

      - name: Verify public APK
        run: |
          set -euo pipefail
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          aapt_path=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$apksigner_path" verify --verbose --print-certs TorrentToDDL.apk | tee apk-signing-certificate.txt
          expected_cert=$(keytool -exportcert -keystore "$TORRENTTODDL_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')
          actual_cert=$(sed -n 's/.*certificate SHA-256 digest: //p' apk-signing-certificate.txt | tr '[:upper:]' '[:lower:]')
          test "$actual_cert" = "$expected_cert"
          test "$actual_cert" = "e543f7458a48cd33751d1a5a747c1cf263ba288059de88f851eb23ef84071a46"
          "$aapt_path" dump badging TorrentToDDL.apk > apk-metadata.txt
          if grep -q '^application-debuggable' apk-metadata.txt; then
            echo "::error::Public APK must not be debuggable"
            exit 1
          fi
          sha256sum TorrentToDDL.apk > SHA256SUMS
          echo "Verified release APK and persistent signing certificate"

      - uses: actions/upload-artifact@v4
        with:
          name: TorrentToDDL-release-apk
          path: |
            TorrentToDDL.apk
            SHA256SUMS
            apk-signing-certificate.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TorrentToDDL-release-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            core/build/reports/**
            core/build/test-results/**
            apk-metadata.txt
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TorrentToDDL-release-apk
          path: apk

      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" apk/TorrentToDDL.apk apk/SHA256SUMS apk/apk-signing-certificate.txt branding/torrenttoddl-logo.svg \
            --verify-tag --title "TorrentToDDL $RELEASE_TAG" \
            --notes-file "release-notes/$RELEASE_TAG.md" --latest
          download_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/TorrentToDDL.apk"
          printf '### Public APK ready\n\n[Download TorrentToDDL.apk](%s)\n' "$download_url" >> "$GITHUB_STEP_SUMMARY"
