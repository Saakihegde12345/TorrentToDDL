name: Apply Apple platform source
on:
  push:
    branches: [apple-platforms]
    paths: [.github/workflows/apply-apple-source.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apple-platforms
      - name: Verify and commit prepared source
        env:
          PATCH_SHA256: e57dbd922b947463be304f7b797ed795c82daa2820814f622fa4450b2670fc27
        run: |
          set -euo pipefail
          printf '%s  apple-source.patch\n' "$PATCH_SHA256" | sha256sum --check
          git apply --check apple-source.patch
          git apply --index --whitespace=fix --exclude='.github/workflows/*' apple-source.patch
          git rm apple-source.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Apple Silicon desktop and native iOS preview'
          git push origin HEAD:apple-platforms
